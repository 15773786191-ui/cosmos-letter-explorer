<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>从地球到地面 · 宇宙来信</title><link href="https://cesium.com/downloads/cesiumjs/releases/1.145/Build/Cesium/Widgets/widgets.css" rel="stylesheet"><link href="style.css" rel="stylesheet"></head><body><div id="earth"></div><header><button id="back">← 返回星海</button><span>地球 / 从太空到地面</span><button id="globe">拉回全球</button></header><section class="info"><div class="kicker">先从湖南的山川开始</div><h1>地球不只是<br>一颗蓝色的球。</h1><p>先看完整地球，再进入张家界山地。<br>真实高程形成山谷起伏，卫星影像覆盖地表。</p><div id="status" role="status">正在载入真实地形与影像…</div><div class="actions"><button id="region" disabled>靠近张家界 ↘</button><button id="land" disabled>降到地表</button></div><div class="ground-controls" id="ground-controls" hidden><button id="left">↶ 左转</button><button id="walk">向前 20 米</button><button id="right">右转 ↷</button><label for="pitch">抬头 / 低头</label><input id="pitch" type="range" min="-40" max="35" value="0"></div><div class="limit">这是地形与影像观察，不是街景。山地近景未包含树木、建筑或精细岩壁的三维模型。影像和高程依赖网络加载。</div></section><footer><span id="height">相机高度 —</span><span id="tiles">影像载入中</span><span>拖动旋转 · 滚轮或双指连续缩放</span></footer><script src="https://cesium.com/downloads/cesiumjs/releases/1.145/Build/Cesium/Cesium.js"></script><script src="earth.js"></script></body></html>
